name: CEWAY V3.0 SSQ 2026112 Tier Snapshot

on:
  push:
    branches: [agent/ceway-v2-research-engine]
    paths:
      - '.github/workflows/v30-tier-2026112-26110.yml'
      - 'research/v30/requests/ssq-2026112.json'
  workflow_dispatch:

jobs:
  pre_draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ceway-v2-research-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Sync verified history
        run: |
          git fetch origin main
          git checkout origin/main -- backend/data/ssq_history.csv backend/data/dlt_history.csv
          grep -q '^2026111,' backend/data/ssq_history.csv || echo '2026111,2026-09-24,6,7,14,22,31,32,5' >> backend/data/ssq_history.csv
          test "$(tail -n 1 backend/data/ssq_history.csv | cut -d, -f1)" = "2026111"
          test "$(tail -n 1 backend/data/dlt_history.csv | cut -d, -f1)" = "26109"
          mkdir -p /tmp/ceway-tier
          cp backend/data/ssq_history.csv /tmp/ceway-tier/ssq-history-thru-2026111.csv
          cp backend/data/dlt_history.csv /tmp/ceway-tier/dlt-history-thru-26109.csv
          tail -n 2 backend/data/ssq_history.csv
          tail -n 2 backend/data/dlt_history.csv
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: SSQ 2026112 prospective forecast
        run: |
          python scripts/predict_v30_request.py --request research/v30/requests/ssq-2026112.json --output /tmp/ceway-tier/ssq-2026112-v30.json | tee /tmp/ceway-tier/ssq-summary.txt
      - name: Upload source snapshot and new forecast
        uses: actions/upload-artifact@v4
        with:
          name: ceway-tier-2026112-26110
          path: /tmp/ceway-tier/*
          if-no-files-found: error
          retention-days: 90
