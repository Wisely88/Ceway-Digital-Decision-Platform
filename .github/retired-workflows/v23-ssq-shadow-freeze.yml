name: CEWAY V2.3 SSQ Shadow Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scorer_v23.py"
      - "backend/generator_v2.py"
      - "backend/research_v2.py"
      - "scripts/freeze_v23_ssq_shadow.py"
      - ".github/workflows/v23-ssq-shadow-freeze.yml"
  workflow_dispatch:
    inputs:
      target_issue:
        description: "Optional explicit future SSQ issue; blank uses numeric successor of current cutoff"
        required: false
        default: ""
      budget:
        description: "Shadow budget in CNY"
        required: false
        default: "20"

concurrency:
  group: ceway-v23-ssq-shadow-freeze-${{ github.sha }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify shadow dependencies
        working-directory: backend
        run: python -m unittest tests.test_scorer_v23 tests.test_generator_v2 tests.test_research_v2 -v

      - name: Freeze prospective SSQ shadow
        env:
          TARGET_ISSUE: ${{ inputs.target_issue || '' }}
          BUDGET: ${{ inputs.budget || '20' }}
        run: |
          if [ -n "$TARGET_ISSUE" ]; then
            python scripts/freeze_v23_ssq_shadow.py \
              --target-issue "$TARGET_ISSUE" \
              --budget "$BUDGET" \
              --output artifacts/ceway_v23_ssq_shadow.json
          else
            python scripts/freeze_v23_ssq_shadow.py \
              --budget "$BUDGET" \
              --output artifacts/ceway_v23_ssq_shadow.json
          fi

      - name: Upload frozen shadow snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v23-ssq-shadow-${{ github.sha }}
          path: artifacts/ceway_v23_ssq_shadow.json
          if-no-files-found: error
