name: CEWAY V3.0 Next Draw 2026109 26107

on:
  push:
    branches: [agent/ceway-v2-research-engine]
    paths:
      - '.github/workflows/v30-next-2026109-26107.yml'
      - 'research/v30/requests/ssq-2026109.json'
      - 'research/v30/requests/dlt-26107.json'
  workflow_dispatch:

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ceway-v2-research-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Sync repository history and append confirmed latest draws in working tree only
        run: |
          git fetch origin main
          git checkout origin/main -- backend/data/ssq_history.csv backend/data/dlt_history.csv
          grep -q '^2026107,' backend/data/ssq_history.csv || echo '2026107,2026-09-15,1,5,9,17,24,33,4' >> backend/data/ssq_history.csv
          grep -q '^2026108,' backend/data/ssq_history.csv || echo '2026108,2026-09-17,6,11,13,14,20,28,16' >> backend/data/ssq_history.csv
          grep -q '^26106,' backend/data/dlt_history.csv || echo '26106,2026-09-16,14,17,21,25,28,4,6' >> backend/data/dlt_history.csv
          tail -n 4 backend/data/ssq_history.csv
          tail -n 4 backend/data/dlt_history.csv
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate next V3.0 prospective freezes
        run: |
          mkdir -p /tmp/v30-next
          python scripts/predict_v30_request.py --request research/v30/requests/ssq-2026109.json --output /tmp/v30-next/ssq-2026109-v30.json | tee /tmp/v30-next/ssq-summary.txt
          python scripts/predict_v30_request.py --request research/v30/requests/dlt-26107.json --output /tmp/v30-next/dlt-26107-v30.json | tee /tmp/v30-next/dlt-summary.txt
      - name: Upload freezes
        uses: actions/upload-artifact@v4
        with:
          name: v30-next-2026109-26107
          path: /tmp/v30-next/*
          if-no-files-found: error
          retention-days: 90
