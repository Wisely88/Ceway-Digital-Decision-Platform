name: CEWAY V2.1 Fresh Exposure Holdout

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/generator_v2.py"
      - "backend/random_control_v2.py"
      - "scripts/run_v21_exposure_ablation.py"
      - "scripts/run_v21_exposure_holdout.py"
      - ".github/workflows/v21-exposure-holdout.yml"
  workflow_dispatch:
    inputs:
      periods:
        description: "Fresh holdout prediction points per configuration"
        required: false
        default: "50"
      excluded_recent_points:
        description: "Exclude recent dev50 + already-consumed V1 holdout50"
        required: false
        default: "100"
      windows:
        description: "Comma-separated history windows"
        required: false
        default: "50,100,200"
      baseline_seeds:
        description: "Matched-random seeds per prediction point"
        required: false
        default: "3"

concurrency:
  group: ceway-v21-fresh-exposure-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify generator and matched-random controls
        working-directory: backend
        run: python -m unittest tests.test_generator_v2 tests.test_random_control_v2 -v

      - name: Run V2.1 fresh historical holdout
        env:
          PERIODS: ${{ inputs.periods || '50' }}
          EXCLUDED_RECENT_POINTS: ${{ inputs.excluded_recent_points || '100' }}
          WINDOWS: ${{ inputs.windows || '50,100,200' }}
          BASELINE_SEEDS: ${{ inputs.baseline_seeds || '3' }}
        run: |
          python scripts/run_v21_exposure_holdout.py \
            --periods "$PERIODS" \
            --excluded-recent-points "$EXCLUDED_RECENT_POINTS" \
            --windows "$WINDOWS" \
            --baseline-seeds "$BASELINE_SEEDS" \
            --budget 20 \
            --strategy balanced \
            --output artifacts/ceway_v21_exposure_holdout.json

      - name: Upload V2.1 fresh holdout report
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v21-fresh-exposure-holdout
          path: artifacts/ceway_v21_exposure_holdout.json
          if-no-files-found: error
