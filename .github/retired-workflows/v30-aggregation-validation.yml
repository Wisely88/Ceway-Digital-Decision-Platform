name: CEWAY V3.0 Aggregation Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax-check V3.0
        run: python -m py_compile backend/multiregime_v30.py scripts/predict_v30_request.py
      - name: Generate SSQ 2026105 V3.0 freeze
        run: |
          mkdir -p /tmp/v30-freezes
          python scripts/predict_v30_request.py \
            --request research/v30/requests/ssq-2026105.json \
            --output /tmp/v30-freezes/ssq-2026105-v30.json
      - name: Generate DLT 26103 V3.0 freeze
        run: |
          python scripts/predict_v30_request.py \
            --request research/v30/requests/dlt-26103.json \
            --output /tmp/v30-freezes/dlt-26103-v30.json
      - name: Upload V3.0 freezes
        uses: actions/upload-artifact@v4
        with:
          name: v30-next-draw-freezes
          path: /tmp/v30-freezes/*.json
          if-no-files-found: error
          retention-days: 90
