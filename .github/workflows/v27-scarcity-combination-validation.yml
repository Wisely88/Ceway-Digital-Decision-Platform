name: CEWAY V2.7 Scarcity Combination Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax-check V2.7 and review CLI
        run: python -m py_compile backend/multiregime_v27.py backend/pushplus_v27.py scripts/push_v27_prediction.py scripts/review_v27_scarcity.py
      - name: Run V2.7 unit tests
        run: python -m unittest tests.test_multiregime_v27 tests.test_pushplus_v27 -v
        working-directory: backend
      - name: Dry-run DLT V2.7 with full scarcity ranking
        run: python scripts/push_v27_prediction.py --game DLT
      - name: Dry-run SSQ V2.7 with full scarcity ranking
        run: python scripts/push_v27_prediction.py --game SSQ
