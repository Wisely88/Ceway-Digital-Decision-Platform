name: CEWAY V2.4 Fixed100 Fresh Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/fixed_window_v24.py"
      - "backend/tests/test_fixed_window_v24.py"
      - "backend/generator_v2.py"
      - "backend/random_control_v2.py"
      - "scripts/run_v24_fixed100_holdout.py"
      - ".github/workflows/v24-fixed100-validation.yml"
  workflow_dispatch:
    inputs:
      periods:
        description: "Fresh validation prediction points"
        required: false
        default: "50"
      baseline_seeds:
        description: "Structure-matched random seeds per prediction point"
        required: false
        default: "3"

concurrency:
  group: ceway-v24-fixed100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify V2.4 is only a metadata wrapper over frozen V2.1 engine
        working-directory: backend
        run: python -m unittest tests.test_fixed_window_v24 tests.test_random_control_v2 -v

      - name: Run V2.4 fresh-only validation
        env:
          PERIODS: ${{ inputs.periods || '50' }}
          BASELINE_SEEDS: ${{ inputs.baseline_seeds || '3' }}
        run: |
          python scripts/run_v24_fixed100_holdout.py \
            --periods "$PERIODS" \
            --excluded-recent-points 150 \
            --baseline-seeds "$BASELINE_SEEDS" \
            --budget 20 \
            --strategy balanced \
            --output artifacts/ceway_v24_fixed100_holdout.json

      - name: Upload V2.4 fresh report
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v24-fixed100-fresh-holdout
          path: artifacts/ceway_v24_fixed100_holdout.json
          if-no-files-found: error
