name: CEWAY V2 Generator Ablation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/generator_v2.py"
      - "backend/tests/test_generator_v2.py"
      - "scripts/run_v2_generator_ablation.py"
      - ".github/workflows/v2-generator-ablation.yml"
  workflow_dispatch:
    inputs:
      periods:
        description: "Development walk-forward periods"
        required: false
        default: "50"
      windows:
        description: "Comma-separated scoring windows"
        required: false
        default: "50,100,200"
      baseline_seeds:
        description: "Matched-random seeds"
        required: false
        default: "3"

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run generator unit tests
        working-directory: backend
        run: python -m unittest tests.test_generator_v2 -v

      - name: Run coverage-generator A/B
        env:
          PERIODS: ${{ inputs.periods || '50' }}
          WINDOWS: ${{ inputs.windows || '50,100,200' }}
          BASELINE_SEEDS: ${{ inputs.baseline_seeds || '3' }}
        run: |
          python scripts/run_v2_generator_ablation.py \
            --periods "$PERIODS" \
            --windows "$WINDOWS" \
            --baseline-seeds "$BASELINE_SEEDS" \
            --budget 20 \
            --strategy balanced \
            --output artifacts/ceway_v2_generator_ablation.json

      - name: Upload ablation report
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v2-generator-ablation
          path: artifacts/ceway_v2_generator_ablation.json
          if-no-files-found: error
