name: CEWAY V2.3 Pruned Scorer Holdout

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scorer_v23.py"
      - "backend/tests/test_scorer_v23.py"
      - "scripts/run_v23_pruned_holdout.py"
      - ".github/workflows/v23-pruned-holdout.yml"
  workflow_dispatch:
    inputs:
      periods:
        description: "Fresh holdout prediction points"
        required: false
        default: "50"
      baseline_seeds:
        description: "Matched-random seeds per prediction point"
        required: false
        default: "3"

concurrency:
  # This is a one-shot evidence-producing holdout. Unrelated branch commits
  # must not cancel an already-started frozen evaluation.
  group: ceway-v23-pruned-holdout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify frozen V2.3 scorer rules
        working-directory: backend
        run: python -m unittest tests.test_scorer_v23 tests.test_generator_v2 tests.test_random_control_v2 -v

      - name: Run exclude-200 fresh holdout
        env:
          PERIODS: ${{ inputs.periods || '50' }}
          BASELINE_SEEDS: ${{ inputs.baseline_seeds || '3' }}
        run: |
          python scripts/run_v23_pruned_holdout.py \
            --periods "$PERIODS" \
            --baseline-seeds "$BASELINE_SEEDS" \
            --budget 20 \
            --strategy balanced \
            --output artifacts/ceway_v23_pruned_holdout.json

      - name: Upload V2.3 holdout report
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v23-pruned-holdout-${{ github.sha }}
          path: artifacts/ceway_v23_pruned_holdout.json
          if-no-files-found: error
