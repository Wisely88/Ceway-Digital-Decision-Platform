name: CEWAY Prediction V9 Tests

on:
  pull_request:
    branches: [main, agent/ceway-v2-research-engine]
    paths:
      - "backend/predictor_v9.py"
      - "backend/main_v9.py"
      - "backend/tests/test_predictor_v9.py"
      - "scripts/run_prediction_v9.py"
      - "docs/ceway_prediction_v9.md"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run V9 tests
        working-directory: backend
        run: python -m unittest tests.test_predictor_v9 -v
