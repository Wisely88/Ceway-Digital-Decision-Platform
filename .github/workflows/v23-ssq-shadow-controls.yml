name: CEWAY V2.3 SSQ Shadow Controls

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/random_control_v2.py"
      - "backend/freeze_v2.py"
      - "research/shadow/ssq/2026094-v23-coverage-shadow.json"
      - "scripts/freeze_v23_ssq_shadow_controls.py"
      - ".github/workflows/v23-ssq-shadow-controls.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of pre-registered matched-random control portfolios"
        required: false
        default: "3"

concurrency:
  group: ceway-v23-ssq-shadow-controls-${{ github.sha }}
  cancel-in-progress: false

jobs:
  freeze-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify control dependencies
        working-directory: backend
        run: python -m unittest tests.test_random_control_v2 tests.test_research_v2 -v

      - name: Freeze matched-random controls
        env:
          COUNT: ${{ inputs.count || '3' }}
        run: |
          python scripts/freeze_v23_ssq_shadow_controls.py \
            --count "$COUNT" \
            --output artifacts/ceway_v23_ssq_shadow_controls.json

      - name: Upload frozen controls
        uses: actions/upload-artifact@v4
        with:
          name: ceway-v23-ssq-shadow-controls-${{ github.sha }}
          path: artifacts/ceway_v23_ssq_shadow_controls.json
          if-no-files-found: error
