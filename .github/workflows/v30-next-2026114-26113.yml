name: CEWAY V3.0 Next Draw 2026114 26113

on:
  push:
    branches: [agent/ceway-v2-research-engine]
    paths:
      - '.github/workflows/v30-next-2026114-26113.yml'
      - 'research/v30/requests/dlt-26113.json'
      - 'research/v30/requests/ssq-2026114.json'
  workflow_dispatch:

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ceway-v2-research-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Sync verified current production history in isolated working tree
        run: |
          git fetch origin main
          git checkout origin/main -- backend/data/ssq_history.csv backend/data/dlt_history.csv
          test "$(tail -n 1 backend/data/ssq_history.csv | cut -d, -f1)" = "2026113"
          test "$(tail -n 1 backend/data/dlt_history.csv | cut -d, -f1)" = "26112"
          tail -n 2 backend/data/ssq_history.csv
          tail -n 2 backend/data/dlt_history.csv
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate next V3.0 prospective freezes
        run: |
          mkdir -p /tmp/v30-next
          python scripts/predict_v30_request.py --request research/v30/requests/ssq-2026114.json --output /tmp/v30-next/ssq-2026114-v30.json | tee /tmp/v30-next/ssq-summary.txt
          python scripts/predict_v30_request.py --request research/v30/requests/dlt-26113.json --output /tmp/v30-next/dlt-26113-v30.json | tee /tmp/v30-next/dlt-summary.txt
          cp backend/data/ssq_history.csv /tmp/v30-next/ssq-history-thru-2026113.csv
          cp backend/data/dlt_history.csv /tmp/v30-next/dlt-history-thru-26112.csv
      - name: Upload prospective snapshots
        uses: actions/upload-artifact@v4
        with:
          name: v30-next-2026114-26113
          path: /tmp/v30-next/*
          if-no-files-found: error
          retention-days: 90
